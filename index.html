<!DOCTYPE html>
<!-- Muktadir Somio — personal site. Single self-contained file: download and push straight to a GitHub repo as index.html (GitHub Pages will serve it as-is). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<script>try{document.documentElement.setAttribute('data-theme', localStorage.getItem('ms-theme')==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Muktadir Somio — applied statistics & data science student, idea tinkerer.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%90%B1</text></svg>">
<title>Muktadir Somio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Great+Vibes&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf5ec; --ink:#332a22; --clay:#c97c46; --clay-deep:#a85f31; --panel:#f0e6d6;
    --nav-bg:#faf5ec; --bubble-bg:#ffffff; --shadow:rgba(51,42,34,0.1); --toggle-track:#e5d9c4; --hint-color:#9b8f7d;
    --fur-hi:#f6c191; --fur-mid:#e59356; --fur-dark:#c97438; --belly:#fbeed9; --blush:#ef9a86; --nose:#b8524a; --cat-ink:#332a22;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{
    --cream:#3c332a; --ink:#f5ecdf; --clay:#e2996b; --clay-deep:#f0b585; --panel:#4c4133;
    --nav-bg:#3c332a; --bubble-bg:#473c2e; --shadow:rgba(0,0,0,0.3); --toggle-track:#5c503f; --hint-color:#cabda5;
  }
  *{box-sizing:inherit;margin:0;padding:0;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
  body{height:100%;background:var(--cream);color:var(--ink);font-family:'Work Sans',sans-serif;overflow:hidden;position:relative;
    opacity:0;animation:pageIn .9s ease forwards;transition:background .4s ease,color .4s ease;}
  @keyframes pageIn{to{opacity:1;}}

  .stage{position:relative;width:100%;height:100%;overflow:hidden;}
  .stage::before{content:'';position:absolute;left:50%;top:56%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);
    background:radial-gradient(circle, var(--clay) 0%, transparent 70%);opacity:0.1;filter:blur(50px);pointer-events:none;transition:opacity .8s ease;}

  .bubble{
    position:absolute;left:min(24vw,220px);bottom:min(42vh,320px);width:min(86vw,460px);
    background:var(--bubble-bg);border:1.5px solid var(--panel);border-radius:22px 22px 22px 6px;
    padding:22px 26px;font-size:1.06rem;line-height:1.6;color:var(--ink);text-align:justify;
    opacity:0;transform:translateY(12px) scale(.97);
    transition:opacity .55s ease, transform .55s cubic-bezier(.22,1,.36,1), background .4s ease, border-color .4s ease;
    box-shadow:0 12px 32px var(--shadow);
  }
  .bubble.show{opacity:1;transform:translateY(0) scale(1);}
  .bubble .line2{display:block;margin-top:10px;font-family:'Fraunces',serif;font-weight:600;color:var(--clay-deep);}
  .bubble .cursor{display:inline-block;width:2px;height:1em;background:var(--clay);margin-left:2px;vertical-align:-3px;animation:blinkc 1s step-end infinite;}
  @keyframes blinkc{50%{opacity:0;}}

  .cat-wrap{
    position:fixed;left:6vw;bottom:-98px;width:220px;height:275px;will-change:transform;
    transition:left 1.9s cubic-bezier(.22,1,.36,1), bottom 1.9s cubic-bezier(.22,1,.36,1),
               top 1.9s cubic-bezier(.22,1,.36,1), transform 1.9s cubic-bezier(.34,1.56,.64,1);
    z-index:5;
  }
  .cat-wrap.out{ left:50%; top:50%; bottom:auto; transform:translate(-50%,-50%) scale(2.05); }
  .cat-wrap svg{width:100%;height:100%;display:block;overflow:visible;}
  .cat-wrap.sit .arm-right{ animation:wave 1.7s ease-in-out infinite; transform-origin:176px 198px; }
  @keyframes wave{0%,100%{transform:rotate(0deg);} 30%{transform:rotate(20deg);} 55%{transform:rotate(-4deg);} 80%{transform:rotate(16deg);}}
  .cat-wrap.sit .ear-l{ animation:earJ .6s ease; transform-origin:60px 132px; }
  .cat-wrap.sit .ear-r{ animation:earJ .6s ease .06s; transform-origin:180px 132px; }
  @keyframes earJ{0%{transform:rotate(0);}30%{transform:rotate(-7deg);}60%{transform:rotate(5deg);}100%{transform:rotate(0);}}
  .cat-wrap.sit .tail{ animation:tailSway 2.6s ease-in-out infinite; transform-origin:198px 235px; }
  @keyframes tailSway{0%,100%{transform:rotate(0deg);}50%{transform:rotate(7deg);}}
  .eyes-blink{ animation:blinke 4.6s ease-in-out infinite; transform-origin:120px 108px; }
  @keyframes blinke{0%,90%,100%{transform:scaleY(1);}94%{transform:scaleY(.12);}}

  .navbar{
    position:fixed;top:0;left:0;right:0;width:100%;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:calc(22px + env(safe-area-inset-top,0px)) clamp(24px,5vw,52px) 22px;
    background:var(--nav-bg);
    box-shadow:0 8px 28px var(--shadow);
    opacity:0;transform:translateY(-14px);pointer-events:none;
    transition:opacity .8s ease, transform .8s cubic-bezier(.22,1,.36,1), background .4s ease;
    z-index:20;
  }
  .navbar.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .navbar .brand{justify-self:start;font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(2rem,4vw,2.5rem);color:var(--ink);white-space:nowrap;text-decoration:none;cursor:pointer;line-height:1;transition:color .2s ease, transform .2s ease;}
  .navbar .brand:hover{color:var(--clay-deep);transform:scale(1.03);}
  .navbar .brand:active{transform:scale(.97);}
  .nav-links{justify-self:center;display:flex;gap:clamp(20px,4vw,44px);}
  .nav-links a{color:var(--clay-deep);text-decoration:none;font-size:1rem;font-weight:500;letter-spacing:.01em;padding:10px 22px;border-radius:999px;background:var(--panel);transition:background .25s ease, color .25s ease, transform .2s ease;display:inline-block;}
  .nav-links a:hover,.nav-links a:focus-visible{background:var(--clay);color:#fff;transform:translateY(-1px);}
  .nav-links a:active{transform:translateY(0) scale(.96);}
  .theme-toggle:focus-visible,.hamburger:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:999px;}
  .nav-right{justify-self:end;display:flex;align-items:center;gap:16px;}

  .theme-toggle{appearance:none;border:none;background:var(--toggle-track);cursor:pointer;padding:0;width:46px;height:26px;border-radius:999px;position:relative;flex-shrink:0;transition:background .35s ease;}
  .theme-toggle .thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .4s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;justify-content:center;}
  [data-theme="dark"] .theme-toggle .thumb{transform:translateX(20px);}
  .theme-toggle svg{position:absolute;width:13px;height:13px;transition:opacity .3s ease;}
  .theme-toggle .sun{opacity:1;color:#e2a13a;}
  .theme-toggle .moon{opacity:0;color:#5b6b8c;}
  [data-theme="dark"] .theme-toggle .sun{opacity:0;}
  [data-theme="dark"] .theme-toggle .moon{opacity:1;}

  .hamburger{display:none;appearance:none;border:none;background:none;cursor:pointer;width:24px;height:18px;position:relative;flex-shrink:0;}
  .hamburger span{position:absolute;left:0;right:0;height:2px;background:var(--ink);border-radius:2px;transition:transform .3s ease, opacity .3s ease;}
  .hamburger span:nth-child(1){top:0;}
  .hamburger span:nth-child(2){top:8px;}
  .hamburger span:nth-child(3){top:16px;}
  .hamburger.open span:nth-child(1){transform:translateY(8px) rotate(45deg);}
  .hamburger.open span:nth-child(2){opacity:0;}
  .hamburger.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg);}

  .nav-drawer{
    position:fixed;top:calc(76px + env(safe-area-inset-top,0px));left:0;right:0;
    background:var(--nav-bg);box-shadow:0 8px 28px var(--shadow);
    display:flex;flex-direction:column;align-items:center;gap:16px;
    max-height:0;overflow:hidden;opacity:0;padding:0 24px;
    transition:max-height .45s cubic-bezier(.22,1,.36,1), opacity .35s ease, padding .45s ease, background .4s ease;
    z-index:19;
  }
  .nav-drawer.open{max-height:220px;opacity:1;padding:20px 24px;}
  .nav-drawer a{color:var(--clay-deep);text-decoration:none;font-size:1.05rem;font-weight:500;padding:11px 24px;border-radius:999px;background:var(--panel);transition:background .25s ease, color .25s ease, transform .2s ease;}
  .nav-drawer a:hover,.nav-drawer a:focus-visible{background:var(--clay);color:#fff;}
  .nav-drawer a:active{transform:scale(.96);}

  footer.hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:1rem;color:var(--hint-color);letter-spacing:.02em;opacity:0;transition:opacity .6s ease, color .4s ease;}
  footer.hint.show{opacity:1;}

  .theme-toggle:active .thumb{transform:scale(.92);}
  [data-theme="dark"] .theme-toggle:active .thumb{transform:translateX(20px) scale(.92);}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
  }

  @media (max-width:640px){
    .bubble{left:16px;right:16px;width:auto;bottom:32vh;font-size:0.95rem;padding:18px 20px;}
    .cat-wrap{width:150px;height:188px;bottom:-68px;left:5vw;}
    .cat-wrap.out{transform:translate(-50%,-50%) scale(1.35);}
    .navbar{display:flex;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;}
    .navbar .brand{font-size:1.7rem;}
    .nav-right{gap:14px;}
    .nav-links{display:none;}
    .hamburger{display:block;}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bubble" id="bubble" aria-live="polite">
    <span id="bubbleText"></span><span class="cursor" id="cursor"></span>
    <span class="line2" id="line2"></span>
  </div>

  <div class="cat-wrap" id="cat">
    <svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="fur" cx="38%" cy="30%" r="75%">
          <stop offset="0%" stop-color="var(--fur-hi)"/>
          <stop offset="60%" stop-color="var(--fur-mid)"/>
          <stop offset="100%" stop-color="var(--fur-dark)"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>

      <ellipse cx="120" cy="286" rx="72" ry="12" fill="#000" opacity="0.14" filter="url(#soft)"/>

      <path class="tail" d="M182 224 C222 214 232 168 210 138 C224 164 218 198 182 210 Z" fill="url(#fur)"/>

      <path d="M52 280 C44 208 62 164 120 164 C178 164 196 208 188 280 Z" fill="url(#fur)"/>
      <path d="M84 278 C79 232 88 196 120 196 C152 196 161 232 156 278 Z" fill="var(--belly)"/>

      <g class="arm-right">
        <path d="M168 216 C186 210 200 216 200 232 C200 246 186 250 172 244 Z" fill="url(#fur)"/>
        <ellipse cx="195" cy="230" rx="12" ry="10" fill="var(--fur-mid)"/>
      </g>
      <path d="M72 216 C56 220 48 234 56 246 C64 256 80 252 86 240 Z" fill="url(#fur)"/>

      <ellipse cx="88" cy="278" rx="18" ry="11" fill="var(--belly)"/>
      <ellipse cx="152" cy="278" rx="18" ry="11" fill="var(--belly)"/>

      <path class="ear-l" d="M50 92 C34 42 66 10 106 44 C82 48 62 66 62 100 Z" fill="url(#fur)"/>
      <path class="ear-r" d="M190 92 C206 42 174 10 134 44 C158 48 178 66 178 100 Z" fill="url(#fur)"/>
      <path d="M58 80 C52 50 70 32 92 52 C76 56 64 68 66 86 Z" fill="var(--blush)" opacity="0.5"/>
      <path d="M182 80 C188 50 170 32 148 52 C164 56 176 68 174 86 Z" fill="var(--blush)" opacity="0.5"/>

      <circle cx="120" cy="110" r="86" fill="url(#fur)"/>

      <ellipse cx="82" cy="132" rx="15" ry="9.5" fill="var(--blush)" opacity="0.5"/>
      <ellipse cx="158" cy="132" rx="15" ry="9.5" fill="var(--blush)" opacity="0.5"/>

      <g class="eyes-blink">
        <ellipse cx="90" cy="108" rx="12" ry="15" fill="var(--cat-ink)"/>
        <ellipse cx="150" cy="108" rx="12" ry="15" fill="var(--cat-ink)"/>
        <circle cx="93.5" cy="101" r="3.4" fill="#fff"/>
        <circle cx="153.5" cy="101" r="3.4" fill="#fff"/>
        <circle cx="86" cy="114" r="1.8" fill="#fff" opacity="0.85"/>
        <circle cx="146" cy="114" r="1.8" fill="#fff" opacity="0.85"/>
      </g>

      <path d="M120 128 C116 122 124 122 120 128 Z" fill="var(--nose)"/>
      <path d="M120 128 Q120 137 108 140 M120 128 Q120 137 132 140" stroke="var(--cat-ink)" stroke-width="2.4" fill="none" stroke-linecap="round"/>

      <g stroke="var(--cat-ink)" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
        <path d="M58 118 L22 110 M58 126 L20 126 M58 134 L22 142"/>
        <path d="M182 118 L218 110 M182 126 L220 126 M182 134 L218 142"/>
      </g>
    </svg>
  </div>
</div>

<nav class="navbar" id="navbar">
  <a class="brand" href="#" onclick="location.reload();return false;">Muktadir Somio</a>
  <div class="nav-links" id="navLinks">
    <a href="https://somiomuktadir.substack.com" target="_blank" rel="noopener">Substack</a>
    <a href="https://github.com/someoww" target="_blank" rel="noopener">GitHub</a>
    <a href="mailto:somiomuktadir@gmail.com">Email</a>
  </div>
  <div class="nav-right">
    <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <span class="thumb">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5Z"/></svg>
      </span>
    </button>
  </div>
</nav>
<div class="nav-drawer" id="navDrawer">
  <a href="https://somiomuktadir.substack.com" target="_blank" rel="noopener">Substack</a>
  <a href="https://github.com/someoww" target="_blank" rel="noopener">GitHub</a>
  <a href="mailto:somiomuktadir@gmail.com">Email</a>
</div>

<footer class="hint" id="hint">Applied Statistics &amp; Data Science · IASDS, University of Dhaka</footer>

<script>
(function(){
  var intro = "Psst \u2014 I'm Muktadir Somio. Second-year Applied Statistics & Data Science student at IASDS, University of Dhaka, and an idea tinkerer at heart \u2014 I play with ideas until they hold or dissolve. Chess sharpens me, poker humbles me, Python is my language of choice even though R runs the curriculum, and I'm slowly hoarding Spanish words on Duolingo. Take a look at my Github page for my projects and substack for I ocassionally share my thoughts, ideas, and other writings there.";
  var outro = "Have a nice day!";
  var bubble=document.getElementById('bubble'), bubbleText=document.getElementById('bubbleText'),
      line2=document.getElementById('line2'), cursor=document.getElementById('cursor'),
      cat=document.getElementById('cat'), navbar=document.getElementById('navbar'), hint=document.getElementById('hint');
  var hamburger=document.getElementById('hamburger'), drawer=document.getElementById('navDrawer'), themeToggle=document.getElementById('themeToggle');

  function typeText(str, el, speed, done){
    var i=0; var t=setInterval(function(){
      el.textContent=str.slice(0,i+1); i++;
      if(i>=str.length){clearInterval(t); if(done)done();}
    }, speed);
  }

  hamburger.addEventListener('click', function(){
    var open = hamburger.classList.toggle('open');
    drawer.classList.toggle('open', open);
    hamburger.setAttribute('aria-expanded', open);
  });
  Array.prototype.forEach.call(drawer.querySelectorAll('a'), function(a){
    a.addEventListener('click', function(){ hamburger.classList.remove('open'); drawer.classList.remove('open'); });
  });
  themeToggle.addEventListener('click', function(){
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('ms-theme', next); }catch(e){}
  });

  window.addEventListener('load', function(){
    setTimeout(function(){
      bubble.classList.add('show');
      typeText(intro, bubbleText, 32, function(){
        setTimeout(function(){
          typeText(outro, line2, 65, function(){
            cursor.style.display='none';
            setTimeout(function(){
              bubble.classList.remove('show');
              setTimeout(function(){
                cat.classList.add('out');
                setTimeout(function(){ cat.classList.add('sit'); setTimeout(function(){ navbar.classList.add('show'); hint.classList.add('show'); }, 350); }, 1900);
              }, 500);
            }, 2400);
          });
        }, 950);
      });
    }, 900);
  });
})();
</script>
</body>
</html>
